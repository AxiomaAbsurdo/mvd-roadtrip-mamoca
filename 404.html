<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f8f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0f" media="(prefers-color-scheme: dark)">
<title>404 — Página não encontrada · Montevideo Tour Guide</title>
<meta name="description" content="Página não encontrada. Volte para o roteiro de Montevidéu.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🇺🇾%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8f6f3;
  --text: #1a1a1d;
  --muted: #5a5a5f;
  --accent: #c45d3e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0f;
    --text: #f0eeeb;
    --muted: #a0a0a5;
    --accent: #e07a5f;
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: grid;
  place-items: center;
  padding: 40px 24px;
  text-align: center;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 480px; }
.code {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(4rem, 18vw, 7rem);
  font-weight: 700;
  color: var(--accent);
  line-height: 1;
  margin-bottom: 12px;
}
h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-size: clamp(1.5rem, 5vw, 2rem);
  font-weight: 600;
  margin-bottom: 12px;
}
p { color: var(--muted); margin-bottom: 28px; line-height: 1.6; }
a {
  display: inline-block;
  padding: 12px 24px;
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  border-radius: 999px;
  font-weight: 500;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
a:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(196,93,62,0.3); }
</style>
</head>
<body>
<main class="wrap">
  <div class="code">404</div>
  <h1>Rota não encontrada / Route not found</h1>
  <p>Essa parada não existe no roteiro. / This stop isn't on the itinerary.</p>
  <a href="./">← Voltar ao início / Back to start</a>
</main>
</body>
</html>
